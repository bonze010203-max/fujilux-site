<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fujilux Email Signature</title>
<style>
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#fbf9f4;color:#0d1c15;padding:40px 24px;margin:0}
.box{max-width:680px;margin:0 auto;background:#fff;border:1px solid rgba(195,138,44,.35);border-radius:10px;padding:32px}
.btn{display:inline-block;margin-top:24px;padding:13px 24px;border-radius:40px;background:#0d1c15;color:#f2b952;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid #c38a2c;cursor:pointer}
.btn:hover{background:#163524}
</style>
</head>
<body>
<div class="box">
  <div id="sig">
    <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Helvetica Neue',Arial,sans-serif;color:#0d1c15;border-top:2px solid #c38a2c;padding-top:14px;margin-top:10px">
      <tr>
        <td style="padding:14px 20px 6px 0;vertical-align:middle;border-right:1px solid #e2d9c8">
          <a href="https://fujilux.mn" target="_blank" style="text-decoration:none;border:0">
            <img src="https://fujilux.mn/assets/sig-logo.png" width="135" height="77" alt="Fujilux Supply" style="display:block;border:0;width:135px;height:77px">
          </a>
        </td>
        <td style="padding:14px 0 6px 20px;vertical-align:middle;font-family:'Helvetica Neue',Arial,sans-serif">
          <div style="font-size:15px;font-weight:700;letter-spacing:1.5px;color:#0d1c15;text-transform:uppercase;line-height:1.2">FUJILUX SUPPLY</div>
          <div style="font-size:11.5px;font-weight:600;color:#b45f06;letter-spacing:0.4px;margin:3px 0 8px">Стратегийн нийлүүлэлтийг бодит болгоно</div>
          <div style="font-size:12.5px;color:#3c4741;line-height:1.6">
            <b style="color:#0d1c15">Утас:</b> <a href="tel:+97699999497" style="color:#0d1c15;text-decoration:none">+976 9999 9497</a> · <a href="tel:+97691990999" style="color:#0d1c15;text-decoration:none">+976 9199 0999</a><br>
            <b style="color:#0d1c15">Имэйл:</b> <a href="mailto:info@fujilux.mn" style="color:#b45f06;text-decoration:none">info@fujilux.mn</a> &nbsp;|&nbsp; <b style="color:#0d1c15">Вэб:</b> <a href="https://fujilux.mn" style="color:#b45f06;text-decoration:none">www.fujilux.mn</a><br>
            <b style="color:#0d1c15">Хаяг:</b> Сүхбаатар дүүрэг, 2-р хороо, 5-р хороолол, Усны 1А, 19 тоот, Улаанбаатар
          </div>
        </td>
      </tr>
    </table>
  </div>
  <button class="btn" id="copyBtn" onclick="copySig()">Логотой гарын үсгийг хуулах (Copy)</button>
</div>
<script>
function copySig(){
  const el=document.getElementById('sig');
  const range=document.createRange();
  range.selectNodeContents(el);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  document.execCommand('copy');
  document.getElementById('copyBtn').textContent='✓ Хуулагдлаа! Gmail Signature хэсэгт Paste (Cmd+V) хийнэ үү';
}
</script>
</body>
</html>
